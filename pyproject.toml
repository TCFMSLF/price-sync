[project]
name = "price-sync"
version = "0.1.0"
description = "Механизм «Триггер на изменение цен в ERP»"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["services"]
