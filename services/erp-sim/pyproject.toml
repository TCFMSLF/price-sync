[project]
name = "erp-sim"
version = "0.1.0"
description = "Имитация ERP с transactional outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16.1",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_sim"]
